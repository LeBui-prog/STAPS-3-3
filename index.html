<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>3×3 · Fiche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light}
html{-webkit-text-size-adjust:100%}
body{margin:0}

/* Layout : onglets (Feuille / Suivi / Archives) ; la feuille = réglages, tableau d'affichage dont chaque côté sélectionne une équipe, puis la fiche de l'équipe choisie */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#151a21; --muted:#5c6673; --line:#d6dbe1;
  --board:#141a22; --board-ink:#f4f6f8; --led:#ffb020;
  --a:#e4572e; --b:#1f6fb2;
  --a-soft:color-mix(in srgb,var(--a) 16%,var(--surface)); --b-soft:color-mix(in srgb,var(--b) 16%,var(--surface));
  --ok:#2e7d4f; --warn:#c98a00; --crit:#c62828;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1318; --surface:#181e26; --ink:#e8ecf0; --muted:#97a2ae; --line:#2a333e;
  --board:#0a0d11; --board-ink:#f4f6f8; --led:#ffb84a;
  --a-soft:color-mix(in srgb,var(--a) 22%,var(--surface)); --b-soft:color-mix(in srgb,var(--b) 22%,var(--surface)); --ok:#5cc28a; --warn:#e8b13a; --crit:#ff6b6b;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1318; --surface:#181e26; --ink:#e8ecf0; --muted:#97a2ae; --line:#2a333e;
  --board:#0a0d11; --board-ink:#f4f6f8; --led:#ffb84a;
  --a-soft:color-mix(in srgb,var(--a) 22%,var(--surface)); --b-soft:color-mix(in srgb,var(--b) 22%,var(--surface)); --ok:#5cc28a; --warn:#e8b13a; --crit:#ff6b6b;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4}
.wrap{max-width:1100px;margin:0 auto;padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
button{font:inherit;cursor:pointer;border:0;border-radius:8px}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--led);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;margin:0}
.a{--tc:var(--a);--ts:var(--a-soft)} .b{--tc:var(--b);--ts:var(--b-soft)}

/* Emblème */
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.wordmark{display:grid;line-height:1}
.wordmark b{font-family:var(--display);font-weight:800;font-size:1.7rem;letter-spacing:.02em}
.wordmark span{font-size:.68rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin-top:2px}

/* Panneaux génériques */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.panel-h h3{font-size:1.15rem}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:8px 12px;font-weight:600;font-size:.88rem}
.btn.primary{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.locked{opacity:.5;cursor:not-allowed;position:relative}
.btn.locked:hover::after{content:"Pour enregistrer un match, changez le nom des équipes";position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);width:220px;white-space:normal;text-align:center;background:var(--ink);color:var(--surface);padding:7px 10px;border-radius:6px;font-size:.8rem;font-weight:500;z-index:5;pointer-events:none}
.btn.danger{color:var(--crit)} .btn.armed{background:var(--crit);color:#fff;border-color:var(--crit)}
.toast{font-size:.88rem;color:var(--muted);min-height:1.2em}
.toast.err{color:var(--crit)} .toast.ok{color:var(--ok)}
/* Archives */
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
/* Fiche consultée depuis un QR */
.fhead{display:flex;align-items:center;justify-content:space-between}
.fhero{background:var(--board);color:var(--board-ink);border-radius:14px;padding:18px;display:grid;gap:12px}
.feyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;color:#b9c2cc}
.fhero h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(2rem,8vw,3rem);line-height:1;text-transform:uppercase;letter-spacing:.03em;text-wrap:balance}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.kpi{background:#ffffff12;border-radius:10px;padding:10px 12px;display:grid}
.kpi b{font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:1;color:var(--led)}
.kpi span{font-size:.78rem;color:#b9c2cc}
.fsub{font-size:.85rem;color:#b9c2cc}
table.bilan th,table.bilan td{text-align:center}
details.fm{border-bottom:1px solid var(--line)}
details.fm summary{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.5fr) auto auto;gap:10px;align-items:center;padding:10px 4px;cursor:pointer;list-style:none}
details.fm summary::-webkit-details-marker{display:none}
details.fm[open] summary{font-weight:600}
details.fm .tbl-wrap{padding-bottom:10px}
.rw{color:var(--ok);font-weight:600} .rl{color:var(--crit);font-weight:600}

.wordmark{display:grid;line-height:1}.wordmark b{font-family:var(--display);font-weight:800;font-size:1.7rem;letter-spacing:.02em}.wordmark span{font-size:.68rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin-top:2px}
.muted{color:var(--muted)}.help{font-size:.82rem;color:var(--muted);margin:0}.win{color:var(--ok);font-weight:600}.res{font-family:var(--display);font-weight:700;font-size:1.05rem}
.panel p{margin:0}

</style>
</head>
<body>
<div class="wrap" id="fiche"><p class="empty">Chargement de la fiche…</p></div>
<script>
/* Page de consultation autonome : lit les données contenues dans le lien du QR code (après le #). Aucun compte, aucune base de données. */
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
function b64u(bytes){let s="";for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function unb64u(str){const s=atob(str.replace(/-/g,"+").replace(/_/g,"/"));const b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b}
async function pack(obj){
  const raw=new TextEncoder().encode(JSON.stringify(obj));
  if(window.CompressionStream){
    try{const buf=await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer();return "z"+b64u(new Uint8Array(buf))}catch(e){}
  }
  return "u"+b64u(raw);
}
async function unpack(tok){
  const mode=tok[0],bytes=unb64u(tok.slice(1));
  let out=bytes;
  if(mode==="z"){
    if(!window.DecompressionStream) throw new Error("old");
    out=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
  }
  return JSON.parse(new TextDecoder().decode(out));
}
const d36=ms=>Math.round(ms/60000).toString(36);
const un36=s=>parseInt(s,36)*60000;


function kpi(v,l){return `<div class="kpi"><b class="num">${v}</b><span>${l}</span></div>`}
const res=(sf,sa)=>sf>sa?'<span class="rw">Victoire</span>':sf<sa?'<span class="rl">Défaite</span>':'<span class="muted">Nul</span>';
const dt=ms=>new Date(ms).toLocaleDateString("fr-FR",{weekday:"short",day:"2-digit",month:"2-digit"})+" "+new Date(ms).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
function ficheTeam(P){
  /* chaque match : totaux de l'équipe [1 pt, 2 pts, bonus, LF, fautes] (anciens QR : détail joueurs, additionné ici) */
  const ms=P.m.map(([d,o,sf,sa,bv,x])=>{
    const c=Array.isArray(x[0])?[2,3,4,5,6].map(k=>x.reduce((s,p)=>s+(p[k]||0),0)):x;
    return {d:un36(d),o,sf,sa,bv,p1:c[0],p2:c[1],p4:c[2],lf:c[3],f:c[4]};
  });
  const n=ms.length,bon=ms.some(m=>m.p4>0);
  const T=k=>ms.reduce((s,m)=>s+m[k],0),avg=k=>n?(T(k)/n).toFixed(1).replace(".",","):"0";
  const W=ms.filter(m=>m.sf>m.sa).length,L=ms.filter(m=>m.sf<m.sa).length,PF=T("sf"),PA=T("sa");
  return `
  <section class="fhero a"><span class="feyebrow">Fiche équipe${P.l?" · "+esc(P.l):""}</span><h1>${esc(P.t)}</h1>
    <span class="fsub">${n} match${n>1?"s":""} · ${W} victoire${W>1?"s":""} · ${L} défaite${L>1?"s":""} · moyennes par match :</span>
    <div class="kpis">${kpi(avg("p1"),"paniers à 1 pt")}${kpi(avg("p2"),"paniers à 2 pts")}${bon?kpi(avg("p4"),"paniers bonus"):""}${kpi(avg("lf"),"lancers francs")}${kpi(avg("f"),"fautes")}${kpi(avg("sf"),"points marqués")}</div></section>
  <section class="panel"><h3>Détail par match</h3><div class="tbl-wrap"><table>
    <thead><tr><th>Date</th><th>Adversaire</th><th class="n">Score</th><th>Résultat</th><th class="n">1 pt</th><th class="n">2 pts</th>${bon?'<th class="n">Bonus</th>':""}<th class="n">LF</th><th class="n">Fautes</th><th class="n">Pts</th></tr></thead>
    <tbody>${ms.slice().reverse().map(m=>`<tr><td>${dt(m.d)}</td><td>${esc(m.o)}</td><td class="n res">${m.sf} – ${m.sa}</td><td>${res(m.sf,m.sa)}</td><td class="n">${m.p1}</td><td class="n">${m.p2}</td>${bon?`<td class="n">${m.p4}</td>`:""}<td class="n">${m.lf}</td><td class="n">${m.f}</td><td class="n"><b>${m.sf}</b></td></tr>`).join("")}</tbody>
    <tfoot><tr><td colspan="2">Total · ${n} match${n>1?"s":""}</td><td class="n">${PF} – ${PA}</td><td>${W} V · ${L} D</td><td class="n">${T("p1")}</td><td class="n">${T("p2")}</td>${bon?`<td class="n">${T("p4")}</td>`:""}<td class="n">${T("lf")}</td><td class="n">${T("f")}</td><td class="n"><b>${PF}</b></td></tr></tfoot>
  </table></div></section>`;
}
function fichePlayer(P){
  const ms=P.m.map(([d,o,sf,sa,bv,p1,p2,p4,lf,f])=>({d:un36(d),o,sf,sa,bv,p1,p2,p4,lf,f,pts:p1+2*p2+lf+p4*bv}));
  const T=k=>ms.reduce((s,m)=>s+m[k],0),W=ms.filter(m=>m.sf>m.sa).length,n=ms.length;
  const bvs=[...new Set(ms.map(m=>m.bv))],bvl=bvs.length===1?bvs[0]+" pts":"Bonus";
  const moy=n?(T("pts")/n).toFixed(1).replace(".",","):"0";
  /* même présentation que le bilan par joueur : stats, puis adversaire et score à droite */
  return `
  <section class="fhero a"><span class="feyebrow">Fiche joueur · ${esc(P.t)}${P.l?" · "+esc(P.l):""}</span><h1>#${esc(P.u)} ${esc(P.n)}</h1>
    <div class="kpis">${kpi(n,"matchs")}${kpi(W,"victoires")}${kpi(T("pts"),"points")}${kpi(moy,"points / match")}${kpi(T("f"),"fautes")}</div></section>
  <section class="panel"><h3>Détail par match</h3><div class="tbl-wrap"><table class="bilan">
    <thead><tr><th>Date</th><th>1 pt</th><th>2 pts</th><th>${bvl}</th><th>LF</th><th>Points</th><th>Moy. pts</th><th>Fautes</th><th>Adversaire</th><th>Score</th></tr></thead>
    <tbody>${ms.map(m=>`<tr><td>${dt(m.d)}</td><td>${m.p1}</td><td>${m.p2}</td><td>${m.p4}</td><td>${m.lf}</td><td><b>${m.pts}</b></td><td></td><td>${m.f}</td><td>${esc(m.o)}</td><td class="${m.sf>m.sa?"win":""}">${m.sf} – ${m.sa}</td></tr>`).join("")}</tbody>
    <tfoot><tr><td>Total · ${n} match${n>1?"s":""}</td><td>${T("p1")}</td><td>${T("p2")}</td><td>${T("p4")}</td><td>${T("lf")}</td><td><b>${T("pts")}</b></td><td>${moy}</td><td>${T("f")}</td><td></td><td></td></tr></tfoot></table></div></section>`;
}

(async()=>{
  const h=(location.hash||"").slice(1),el=$("fiche");
  const head=`<header class="fhead"><div class="wordmark"><b>3×3</b><span>Feuille de match</span></div></header>`;
  if(!/^[ej][zu][A-Za-z0-9_-]+$/.test(h)){el.innerHTML=head+`<section class="panel"><h3>Scannez un QR code</h3><p>Cette page affiche la fiche d'une équipe ou d'un joueur. Scannez le QR code remis par votre enseignant avec l'appareil photo de votre téléphone.</p></section>`;return}
  try{
    const P=await unpack(h.slice(1));
    el.innerHTML=head+(h[0]==="e"?ficheTeam(P):fichePlayer(P))+`<p class="help">Données arrêtées le ${new Date(un36(P.g)).toLocaleDateString("fr-FR")} : elles ne se mettent pas à jour toutes seules. Demandez un nouveau QR code à votre enseignant après de nouveaux matchs.</p>`;
    document.title=(h[0]==="e"?P.t:P.n)+" · 3×3";
  }catch(e){
    el.innerHTML=head+`<section class="panel"><h3>Fiche illisible</h3><p>${e?.message==="old"?"Ce navigateur est trop ancien pour lire ce QR code. Essayez avec un autre téléphone ou mettez le navigateur à jour.":"Le lien de ce QR code est incomplet. Scannez-le à nouveau en entier."}</p></section>`;
  }
})();
</script>
</body>
</html>
